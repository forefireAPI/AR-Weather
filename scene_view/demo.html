<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="//cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
</head>
<body>
    <a-scene arjs='sourceType: webcam; debugUIEnabled: false;'>
        <a-entity id="model" position="0 0 0" scale="1 1 1"></a-entity>
        <a-entity movement-controls="fly: true">
            <a-entity camera position="10 1.6 0" look-controls></a-entity>
        </a-entity>
    </a-scene>

    <script>
        window.addEventListener('load', function() {
            var urlParams = new URLSearchParams(window.location.search);
            var file = urlParams.get('file'); // Get 'file' from URL parameter
            if (file) {
                var model = document.getElementById('model');
                model.setAttribute('gltf-model', 'url(' + file + ')'); // Set the model
            }
        });
    </script>
</body>
</html>
